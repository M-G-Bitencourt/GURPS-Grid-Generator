<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GURPS Grid Generator</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="ui">
            <button id="btnTogglePanel" type="button" data-i18n-title="togglePanel" aria-label="−">−</button>
            <div class="panel-body">
                <div class="control-group">
                    <label for="language" data-i18n="languageLabel">Idioma</label>
                    <select id="language">
                        <option value="pt-BR">Português (Brasil)</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <div class="control-group">
                    <label data-i18n="modeLabel">Modo de Interação</label>
                    <div class="radio-group">
                        <input type="radio" name="mode" value="tokens" id="modeTokens" checked />
                        <label for="modeTokens" data-i18n="modeTokens">Tokens</label>

                        <input type="radio" name="mode" value="terrain" id="modeTerrain" />
                        <label for="modeTerrain" data-i18n="modeTerrain">Terreno</label>

                        <input type="radio" name="mode" value="walls" id="modeWalls" />
                        <label for="modeWalls" data-i18n="modeWalls">Paredes</label>

                        <input type="radio" name="mode" value="camera" id="modeCamera" />
                        <label for="modeCamera" data-i18n="modeCamera">Câmera</label>
                    </div>
                </div>

                <div class="control-group">
                    <label for="terrainColor" data-i18n="terrainColorLabel">Cor do Terreno (Hexágono)</label>
                    <input type="color" id="terrainColor" value="#a3d9a5" />
                </div>

                <div class="control-group">
                    <label for="tokenName" data-i18n="tokenNameLabel">Nome do Token</label>
                    <input
                        type="text"
                        id="tokenName"
                        data-i18n-placeholder="tokenNamePlaceholder"
                        placeholder="Nome do token"
                        maxlength="60"
                    />
                </div>

                <div class="control-group">
                    <label for="tokenColor" data-i18n="tokenColorLabel">Cor do Token</label>
                    <input type="color" id="tokenColor" value="#3399ff" />
                </div>

                <div class="control-group">
                    <label for="tokenShape" data-i18n="tokenShapeLabel">Formato (Multi-Hex)</label>
                    <select id="tokenShape">
                        <option value="1x1" data-i18n="shape1x1">1 Hex (Padrão)</option>
                        <option value="1x2" data-i18n="shape1x2">2 Hex (Linha)</option>
                        <option value="1x3" data-i18n="shape1x3">3 Hex (Linha Média)</option>
                        <option value="1x4" data-i18n="shape1x4">4 Hex (Linha Longa)</option>
                        <option value="triangulo" data-i18n="shapeTri">3 Hex (Triângulo)</option>
                        <option value="2x2" data-i18n="shape2x2">4 Hex (Bloco Largo)</option>
                        <option value="2x3" data-i18n="shape2x3">6 Hex (Retângulo)</option>
                        <option value="gigante" data-i18n="shapeGiant">7 Hex (Gigante)</option>
                        <option value="colossal" data-i18n="shapeColossal">19 Hex (Colossal)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="mapName" data-i18n="mapNameLabel">Nome do Mapa</label>
                    <input
                        type="text"
                        id="mapName"
                        data-i18n-placeholder="mapNamePlaceholder"
                        placeholder="Nome do mapa"
                        maxlength="80"
                    />
                </div>

                <div class="btn-group">
                    <button id="btnSave" type="button" data-i18n="btnSave">Salvar</button>
                    <button id="btnLoad" type="button" data-i18n="btnLoad">Carregar</button>
                    <button id="btnNew" type="button" data-i18n="btnNew">Novo</button>
                </div>

                <div class="btn-group">
                    <button id="btnUndo" type="button" data-i18n="btnUndo">Desfazer</button>
                    <button id="btnRedo" type="button" data-i18n="btnRedo">Refazer</button>
                    <button id="btnCenter" type="button" data-i18n="btnCenter">Centralizar</button>
                </div>

                <div class="control-group" style="margin-top: 10px">
                    <label class="checkbox-row">
                        <input type="checkbox" id="showCoords" />
                        <span data-i18n="showCoords">Mostrar coordenadas</span>
                    </label>
                </div>

                <ul class="instructions">
                    <li data-i18n="helpTokens"></li>
                    <li data-i18n="helpTerrain"></li>
                    <li data-i18n="helpRotate"></li>
                    <li data-i18n="helpSelect"></li>
                    <li data-i18n="helpWalls"></li>
                    <li data-i18n="helpCamera"></li>
                    <li data-i18n="helpZoom"></li>
                    <li data-i18n="helpUndo"></li>
                </ul>

                <input type="file" id="fileInput" accept=".json" hidden />
            </div>
        </div>

        <canvas id="hexCanvas"></canvas>
        <div id="status" role="status" aria-live="polite"></div>

        <script src="js/hex.js"></script>
        <script src="js/i18n.js"></script>
        <script src="js/schema.js"></script>
        <script src="js/state.js"></script>
        <script src="js/render.js"></script>
        <script src="js/io.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
